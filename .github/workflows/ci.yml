name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Generate deterministic lock candidate
        run: cargo +1.90.0 generate-lockfile
      - name: Preserve lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --all-targets
      - name: Require committed deterministic lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code -- Cargo.lock
