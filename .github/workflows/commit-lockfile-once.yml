name: commit-lockfile-once

on:
  push:
    branches:
      - feat/desktop-control-plane

permissions:
  contents: write

jobs:
  commit-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/desktop-control-plane
          persist-credentials: true
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
      - name: Generate and commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          git rm .github/workflows/commit-lockfile-once.yml
          git add Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit deterministic Cargo.lock'
          git push origin HEAD:feat/desktop-control-plane
