name: materialize-certified-lock

on:
  push:
    branches:
      - hardening/current-main-local-boundary-v1
    paths:
      - .github/workflows/materialize-certified-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: giw-certified-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: ${{ github.ref }}

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust 1.90
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Generate and verify certified lockfile
        shell: bash
        env:
          EXPECTED_LOCK_SHA256: 14fa96d4cff8a1737195a7a7514c9b1d93dae92fbdfa2558cc2b4806a8a5dee3
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          actual="$(sha256sum Cargo.lock | awk '{print $1}')"
          test "$actual" = "$EXPECTED_LOCK_SHA256"

      - name: Commit certified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches the certified artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit certified Cargo.lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
